name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x86_64
            deployment_target: ""
          - runner: ubuntu-22.04-arm
            target: linux-arm64
            deployment_target: ""
          - runner: macos-26
            target: macos-arm64
            deployment_target: "13.0"
          - runner: macos-26-intel
            target: macos-x86_64
            deployment_target: "13.0"
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.18.2.0"
      - run: cabal update
      - run: cabal build hledger-mcp
      - run: ./hledger-mcp/test/smoke.sh
      - run: ./scripts/package-unix.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*.tar.gz

  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.18.2.0"
      - run: cabal update
      - run: cabal build hledger-mcp
      - shell: pwsh
        run: ./scripts/package-windows.ps1 -Target "windows-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: release/*.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-unix, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes --verify-tag
